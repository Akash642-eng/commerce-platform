apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: default          # FIX Bug#1: explicit namespace
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
        - name: order-service
          image: order-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secret
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "250m"
          livenessProbe:
            httpGet:
              path: /health      # FIX Bug#6: was /
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health      # FIX Bug#6: was /
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5

---

apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: default            # FIX Bug#1: explicit namespace
spec:
  type: ClusterIP               # FIX Bug#2: was NodePort
  selector:
    app: order-service
  ports:
    - port: 8000
      targetPort: 8000
  # FIX: removed hardcoded nodePort: 30006 — not valid on ClusterIP
