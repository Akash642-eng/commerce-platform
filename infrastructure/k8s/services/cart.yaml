apiVersion: apps/v1
kind: Deployment

metadata:
  name: cart-service
  namespace: backend
  labels:
    app: cart-service

spec:
  replicas: 1

  selector:
    matchLabels:
      app: cart-service

  template:
    metadata:
      labels:
        app: cart-service

    spec:
      containers:
        - name: cart-service

          image: cart-service:v3
          imagePullPolicy: Never

          ports:
            - containerPort: 8000

          envFrom:
            - configMapRef:
                name: app-config

            - secretRef:
                name: app-secret

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "250m"
              memory: "256Mi"

          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10

          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5

---

apiVersion: v1
kind: Service

metadata:
  name: cart-service
  namespace: backend
  labels:
    app: cart-service

spec:
  type: ClusterIP

  selector:
    app: cart-service

  ports:
    - port: 8000
      targetPort: 8000