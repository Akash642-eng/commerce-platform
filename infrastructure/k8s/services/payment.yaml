apiVersion: apps/v1
kind: Deployment

metadata:
  name: payment-service
  namespace: backend

spec:
  replicas: 1

  selector:
    matchLabels:
      app: payment-service

  template:
    metadata:
      labels:
        app: payment-service

    spec:
      containers:

        - name: payment-service

          image: payment-service:v3
          imagePullPolicy: Never

          ports:
            - containerPort: 8000
            - containerPort: 8011
            - containerPort: 8012

          envFrom:
            - configMapRef:
                name: app-config

            - secretRef:
                name: app-secret

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "250m"
              memory: "256Mi"

          livenessProbe:
            httpGet:
              path: /health
              port: 8000

            initialDelaySeconds: 10
            periodSeconds: 10

          readinessProbe:
            httpGet:
              path: /health
              port: 8000

            initialDelaySeconds: 5
            periodSeconds: 5

---

apiVersion: v1
kind: Service

metadata:
  name: payment-service
  namespace: backend

spec:
  type: ClusterIP

  selector:
    app: payment-service

  ports:

    - name: api
      port: 8000
      targetPort: 8000

    - name: consumer-metrics
      port: 8011
      targetPort: 8011

    - name: dlq-metrics
      port: 8012
      targetPort: 8012