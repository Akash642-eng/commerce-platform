apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: rabbitmq-service-ingress

spec:
  ingressClassName: nginx

  rules:
    - host: rabbitmq.local

      http:
        paths:
          - path: /
            pathType: Prefix

            backend:
              service:
                name: rabbitmq-service

                port:
                  number: 8000