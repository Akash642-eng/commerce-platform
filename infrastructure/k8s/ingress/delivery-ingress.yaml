apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: delivery-service-ingress
  namespace: default

spec:
  ingressClassName: nginx

  rules:
    - host: delivery.local

      http:
        paths:
          - path: /
            pathType: Prefix

            backend:
              service:
                name: delivery-service

                port:
                  number: 8000