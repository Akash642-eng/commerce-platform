  PAYMENT_SERVICE: http://payment-service:8000
  CART_SERVICE: http://cart-service:8000
  DELIVERY_SERVICE: http://delivery-service:8000
  NOTIFICATION_SERVICE: http://notification-service:8000
  SUPPORT_SERVICE: http://support-service:8000