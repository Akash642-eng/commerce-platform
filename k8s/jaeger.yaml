apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: observability

spec:
  replicas: 1

  selector:
    matchLabels:
      app: jaeger

  template:
    metadata:
      labels:
        app: jaeger

    spec:
      containers:
        - name: jaeger
          image: jaegertracing/all-in-one:latest

          ports:
            - containerPort: 16686
            - containerPort: 6831
              protocol: UDP
            - containerPort: 14268

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"

---
apiVersion: v1
kind: Service
metadata:
  name: jaeger
  namespace: observability

spec:
  selector:
    app: jaeger

  ports:
    - name: ui
      port: 16686
      targetPort: 16686

    - name: collector
      port: 14268
      targetPort: 14268

    - name: agent
      port: 6831
      targetPort: 6831
      protocol: UDP