apiVersion: apps/v1
kind: Deployment

metadata:
  name: postgres

spec:
  replicas: 1

  selector:
    matchLabels:
      app: postgres

  template:
    metadata:
      labels:
        app: postgres

    spec:
      containers:
        - name: postgres

          image: postgres:15

          ports:
            - containerPort: 5432

          env:
            - name: POSTGRES_USER
              value: commerce

            - name: POSTGRES_PASSWORD
              value: commerce

            - name: POSTGRES_DB
              value: commerce_db

          resources:
            requests:
              cpu: "150m"
              memory: "256Mi"

            limits:
              cpu: "400m"
              memory: "768Mi"

          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data

      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: postgres-pvc

---

apiVersion: v1
kind: Service

metadata:
  name: postgres

spec:
  type: ClusterIP

  selector:
    app: postgres

  ports:
    - port: 5432
      targetPort: 5432