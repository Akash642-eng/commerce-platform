apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: database

spec:
  replicas: 1

  selector:
    matchLabels:
      app: postgres

  strategy:
    type: Recreate

  template:
    metadata:
      labels:
        app: postgres

    spec:
      containers:
        - name: postgres
          image: postgres:15
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 5432

          env:
            - name: POSTGRES_USER
              value: commerce

            - name: POSTGRES_PASSWORD
              value: commerce

            - name: POSTGRES_DB
              value: commerce_db

          resources:
            requests:
              cpu: "150m"
              memory: "256Mi"

            limits:
              cpu: "400m"
              memory: "768Mi"

          livenessProbe:
            tcpSocket:
              port: 5432
            initialDelaySeconds: 20
            periodSeconds: 10

          readinessProbe:
            tcpSocket:
              port: 5432
            initialDelaySeconds: 10
            periodSeconds: 5

          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data

      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: postgres-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: database

spec:
  type: ClusterIP

  selector:
    app: postgres

  ports:
    - port: 5432
      targetPort: 5432