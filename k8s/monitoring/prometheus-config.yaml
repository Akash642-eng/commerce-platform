apiVersion: v1
kind: ConfigMap

metadata:
  name: prometheus-config
  namespace: monitoring

data:
  prometheus.yml: |
    global:
      scrape_interval: 5s

    scrape_configs:

      - job_name: 'api-gateway'
        metrics_path: /metrics
        static_configs:
          - targets: ['api-gateway.backend.svc.cluster.local:8000']

      - job_name: 'auth-service'
        metrics_path: /metrics
        static_configs:
          - targets: ['auth-service.default.svc.cluster.local:8000']

      - job_name: 'user-service'
        metrics_path: /metrics
        static_configs:
          - targets: ['user-service.default.svc.cluster.local:8000']

      - job_name: 'product-service'
        metrics_path: /metrics
        static_configs:
          - targets: ['product-service.default.svc.cluster.local:8000']

      - job_name: 'cart-service'
        metrics_path: /metrics
        static_configs:
          - targets: ['cart-service.default.svc.cluster.local:8000']

      - job_name: 'order-service'
        metrics_path: /metrics
        static_configs:
          - targets: ['order-service.default.svc.cluster.local:8000']

      - job_name: 'payment-service'
        metrics_path: /metrics
        static_configs:
          - targets: ['payment-service.default.svc.cluster.local:8000']

      - job_name: 'delivery-service'
        metrics_path: /metrics
        static_configs:
          - targets: ['delivery-service.default.svc.cluster.local:8000']

      - job_name: 'notification-service'
        metrics_path: /metrics
        static_configs:
          - targets: ['notification-service.default.svc.cluster.local:8000']

      - job_name: 'inventory-service'
        metrics_path: /metrics
        static_configs:
          - targets: ['inventory-service.default.svc.cluster.local:8000']

      - job_name: 'support-service'
        metrics_path: /metrics
        static_configs:
          - targets: ['support-service.default.svc.cluster.local:8000']

      - job_name: 'rabbitmq'
        metrics_path: /metrics
        static_configs:
          - targets: ['rabbitmq.messaging.svc.cluster.local:15692']

      - job_name: 'redis'
        metrics_path: /metrics
        static_configs:
          - targets: ['redis-exporter.monitoring.svc.cluster.local:9121']

      - job_name: 'postgres'
        metrics_path: /metrics
        static_configs:
          - targets: ['postgres-exporter.monitoring.svc.cluster.local:9187']

      - job_name: 'kube-state-metrics'
        metrics_path: /metrics
        static_configs:
          - targets: ['kube-state-metrics.monitoring.svc.cluster.local:8080']

      - job_name: 'node-exporter'
        metrics_path: /metrics
        static_configs:
          - targets: ['node-exporter.monitoring.svc.cluster.local:9100']

      - job_name: 'prometheus'
        metrics_path: /metrics
        static_configs:
          - targets: ['prometheus.monitoring.svc.cluster.local:9090']