apiVersion: v1
kind: ConfigMap

metadata:
  name: prometheus-config
  namespace: monitoring

data:
  prometheus.yml: |
    global:
      scrape_interval: 5s

    scrape_configs:

      - job_name: 'api-gateway'
        static_configs:
          - targets: ['api-gateway.backend.svc.cluster.local:8000']

      - job_name: 'auth-service'
        static_configs:
          - targets: ['auth-service.backend.svc.cluster.local:8000']

      - job_name: 'user-service'
        static_configs:
          - targets: ['user-service.backend.svc.cluster.local:8000']

      - job_name: 'product-service'
        static_configs:
          - targets: ['product-service.backend.svc.cluster.local:8000']

      - job_name: 'cart-service'
        static_configs:
          - targets: ['cart-service.backend.svc.cluster.local:8000']

      - job_name: 'order-service'
        static_configs:
          - targets: ['order-service.backend.svc.cluster.local:8000']

      - job_name: 'payment-service'
        static_configs:
          - targets: ['payment-service.backend.svc.cluster.local:8000']

      - job_name: 'delivery-service'
        static_configs:
          - targets: ['delivery-service.backend.svc.cluster.local:8000']

      - job_name: 'notification-service'
        static_configs:
          - targets: ['notification-service.backend.svc.cluster.local:8000']

      - job_name: 'inventory-service'
        static_configs:
          - targets: ['inventory-service.backend.svc.cluster.local:8000']

      - job_name: 'support-service'
        static_configs:
          - targets: ['support-service.backend.svc.cluster.local:8000']

      - job_name: 'rabbitmq'
        static_configs:
          - targets: ['rabbitmq.messaging.svc.cluster.local:15692']

      - job_name: 'prometheus'
        static_configs:
          - targets: ['prometheus.monitoring.svc.cluster.local:9090']