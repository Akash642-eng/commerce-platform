apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: observability

spec:
  replicas: 1

  selector:
    matchLabels:
      app: jaeger

  template:
    metadata:
      labels:
        app: jaeger

    spec:
      containers:
        - name: jaeger

          image: jaegertracing/all-in-one:1.57

          ports:
            # Jaeger UI
            - containerPort: 16686

            # OTLP gRPC
            - containerPort: 4317

            # OTLP HTTP
            - containerPort: 4318

            # Jaeger collector HTTP
            - containerPort: 14268

          env:
            - name: COLLECTOR_OTLP_ENABLED
              value: "true"

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "250m"
              memory: "256Mi"

---
apiVersion: v1
kind: Service
metadata:
  name: jaeger-collector
  namespace: observability

spec:
  selector:
    app: jaeger

  ports:

    # OTLP gRPC
    - name: otlp-grpc
      port: 4317
      targetPort: 4317

    # OTLP HTTP
    - name: otlp-http
      port: 4318
      targetPort: 4318

    # Jaeger collector
    - name: collector
      port: 14268
      targetPort: 14268

---
apiVersion: v1
kind: Service
metadata:
  name: jaeger-query
  namespace: observability

spec:
  selector:
    app: jaeger

  ports:
    - name: ui
      port: 16686
      targetPort: 16686