apiVersion: apps/v1
kind: Deployment

metadata:
  name: postgres-exporter
  namespace: monitoring

spec:
  replicas: 1

  selector:
    matchLabels:
      app: postgres-exporter

  template:
    metadata:
      labels:
        app: postgres-exporter

    spec:
      containers:
        - name: postgres-exporter

          image: prometheuscommunity/postgres-exporter

          env:
            - name: DATA_SOURCE_NAME
              value: "postgresql://commerce_user:commerce_password@postgres.database.svc.cluster.local:5432/commerce_db?sslmode=disable"

          ports:
            - containerPort: 9187

          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"

            limits:
              cpu: "100m"
              memory: "128Mi"

---

apiVersion: v1
kind: Service

metadata:
  name: postgres-exporter
  namespace: monitoring

spec:
  selector:
    app: postgres-exporter

  ports:
    - port: 9187
      targetPort: 9187