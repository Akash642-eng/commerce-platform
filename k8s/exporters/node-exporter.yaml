apiVersion: apps/v1
kind: DaemonSet

metadata:
  name: node-exporter
  namespace: monitoring

spec:
  selector:
    matchLabels:
      app: node-exporter

  template:
    metadata:
      labels:
        app: node-exporter

    spec:
      hostNetwork: true
      hostPID: true

      containers:
        - name: node-exporter

          image: prom/node-exporter:latest

          args:
            - --path.rootfs=/host

          ports:
            - containerPort: 9100
              hostPort: 9100

          volumeMounts:
            - name: root
              mountPath: /host
              readOnly: true

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "200m"
              memory: "256Mi"

      volumes:
        - name: root
          hostPath:
            path: /

---

apiVersion: v1
kind: Service

metadata:
  name: node-exporter
  namespace: monitoring

spec:
  selector:
    app: node-exporter

  ports:
    - port: 9100
      targetPort: 9100