apiVersion: apps/v1
kind: Deployment

metadata:
  name: postgres
  namespace: {{ .Values.namespace.database }}

spec:
  replicas: 1

  strategy:
    type: Recreate

  selector:
    matchLabels:
      app: postgres

  template:
    metadata:
      labels:
        app: postgres

    spec:
      containers:
        - name: postgres

          image: postgres:15

          env:
            - name: POSTGRES_USER
              value: commerce

            - name: POSTGRES_PASSWORD
              value: commerce

            - name: POSTGRES_DB
              value: commerce_db

          ports:
            - containerPort: 5432

          resources:
            requests:
              cpu: 150m
              memory: 256Mi

            limits:
              cpu: 400m
              memory: 768Mi

          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data

      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: postgres-pvc

---

apiVersion: v1
kind: Service

metadata:
  name: postgres
  namespace: {{ .Values.namespace.database }}

spec:
  selector:
    app: postgres

  ports:
    - port: 5432
      targetPort: 5432

  type: ClusterIP