apiVersion: apps/v1
kind: Deployment

metadata:
  name: api-gateway
  namespace: {{ $.Release.Namespace }}

spec:
  replicas: {{ .Values.replicaCount }}

  selector:
    matchLabels:
      app: api-gateway

  template:
    metadata:
      labels:
        app: api-gateway

    spec:
      containers:
        - name: api-gateway

          image: api-gateway:latest

          imagePullPolicy: {{ .Values.image.pullPolicy }}

          ports:
            - containerPort: 8000

          resources:
            requests:
              cpu: {{ .Values.resources.requests.cpu }}
              memory: {{ .Values.resources.requests.memory }}

            limits:
              cpu: {{ .Values.resources.limits.cpu }}
              memory: {{ .Values.resources.limits.memory }}

---

apiVersion: v1
kind: Service

metadata:
  name: api-gateway
  namespace: {{ $.Release.Namespace }}

spec:
  selector:
    app: api-gateway

  ports:
    - port: 8000
      targetPort: 8000

  type: ClusterIP