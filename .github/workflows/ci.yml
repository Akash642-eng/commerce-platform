name: CI Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build-and-check:
    runs-on: ubuntu-latest

    steps:

      # --------------------------------
      # CHECKOUT
      # --------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4


      # --------------------------------
      # PYTHON SETUP
      # --------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # --------------------------------
      # INSTALL GLOBAL TOOLS
      # --------------------------------
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8


      # --------------------------------
      # LINT CHECK
      # --------------------------------
      - name: Run flake8
        run: |
          flake8 services shared \
            --count \
            --select=E9,F63,F7,F82 \
            --show-source \
            --statistics


      # --------------------------------
      # PYTHON IMPORT VALIDATION
      # --------------------------------
      - name: Compile Python files
        run: |
          python -m compileall services
          python -m compileall shared


      # --------------------------------
      # DOCKER BUILDX
      # --------------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3


      # --------------------------------
      # BUILD API GATEWAY
      # FIX: Use repo root (.) as build context and -f to point at the Dockerfile.
      # The Dockerfiles use paths like COPY services/api_gateway/... which are
      # relative to the repo root, not to the service subdirectory.
      # --------------------------------
      - name: Build API Gateway
        run: |
          docker build \
            -t api-gateway \
            -f ./services/api_gateway/Dockerfile \
            .


      # --------------------------------
      # BUILD AUTH SERVICE
      # --------------------------------
      - name: Build Auth Service
        run: |
          docker build \
            -t auth-service \
            -f ./services/auth_service/Dockerfile \
            .


      # --------------------------------
      # BUILD USER SERVICE
      # --------------------------------
      - name: Build User Service
        run: |
          docker build \
            -t user-service \
            -f ./services/user_service/Dockerfile \
            .


      # --------------------------------
      # BUILD PRODUCT SERVICE
      # --------------------------------
      - name: Build Product Service
        run: |
          docker build \
            -t product-service \
            -f ./services/product_service/Dockerfile \
            .


      # --------------------------------
      # BUILD INVENTORY SERVICE
      # --------------------------------
      - name: Build Inventory Service
        run: |
          docker build \
            -t inventory-service \
            -f ./services/inventory_service/Dockerfile \
            .


      # --------------------------------
      # BUILD CART SERVICE
      # --------------------------------
      - name: Build Cart Service
        run: |
          docker build \
            -t cart-service \
            -f ./services/cart_service/Dockerfile \
            .


      # --------------------------------
      # BUILD ORDER SERVICE
      # --------------------------------
      - name: Build Order Service
        run: |
          docker build \
            -t order-service \
            -f ./services/order_service/Dockerfile \
            .


      # --------------------------------
      # BUILD PAYMENT SERVICE
      # --------------------------------
      - name: Build Payment Service
        run: |
          docker build \
            -t payment-service \
            -f ./services/payment_service/Dockerfile \
            .


      # --------------------------------
      # BUILD DELIVERY SERVICE
      # --------------------------------
      - name: Build Delivery Service
        run: |
          docker build \
            -t delivery-service \
            -f ./services/delivery_service/Dockerfile \
            .


      # --------------------------------
      # BUILD NOTIFICATION SERVICE
      # --------------------------------
      - name: Build Notification Service
        run: |
          docker build \
            -t notification-service \
            -f ./services/notification_service/Dockerfile \
            .


      # --------------------------------
      # BUILD SUPPORT SERVICE
      # --------------------------------
      - name: Build Support Service
        run: |
          docker build \
            -t support-service \
            -f ./services/support_service/Dockerfile \
            .


      # --------------------------------
      # SUCCESS
      # --------------------------------
      - name: CI Success
        run: |
          echo "All checks + builds passed successfully 🚀"