name: CI Pipeline

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API Gateway
        run: docker build -t api-gateway ./api-gateway

      - name: Build Backend Services
        run: |
          docker build -t auth-service ./backend/auth-service
          docker build -t user-service ./backend/user-service
          docker build -t product-service ./backend/product-service
          docker build -t inventory-service ./backend/inventory-service
          docker build -t cart-service ./backend/cart-service
          docker build -t order-service ./backend/order-service
          docker build -t payment-service ./backend/payment-service
          docker build -t delivery-service ./backend/delivery-service
          docker build -t notification-service ./backend/notification-service
          docker build -t support-service ./backend/support-service

      - name: CI Success
        run: echo "All services built successfully 🚀"