name: CI Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build-and-check:
    runs-on: ubuntu-latest

    steps:


      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"



      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8


   
      - name: Run flake8
        run: |
          flake8 services shared \
            --count \
            --select=E9,F63,F7,F82 \
            --show-source \
            --statistics



      - name: Compile Python files
        run: |
          python -m compileall services
          python -m compileall shared



      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3



      - name: Build API Gateway
        run: |
          docker build \
            -t api-gateway \
            -f ./services/api_gateway/Dockerfile \
            .

      - name: Build Auth Service
        run: |
          docker build \
            -t auth-service \
            -f ./services/auth_service/Dockerfile \
            .


      - name: Build User Service
        run: |
          docker build \
            -t user-service \
            -f ./services/user_service/Dockerfile \
            .


      - name: Build Product Service
        run: |
          docker build \
            -t product-service \
            -f ./services/product_service/Dockerfile \
            .


      - name: Build Inventory Service
        run: |
          docker build \
            -t inventory-service \
            -f ./services/inventory_service/Dockerfile \
            .


     
      - name: Build Cart Service
        run: |
          docker build \
            -t cart-service \
            -f ./services/cart_service/Dockerfile \
            .


      - name: Build Order Service
        run: |
          docker build \
            -t order-service \
            -f ./services/order_service/Dockerfile \
            .


    
      - name: Build Payment Service
        run: |
          docker build \
            -t payment-service \
            -f ./services/payment_service/Dockerfile \
            .


  
      - name: Build Delivery Service
        run: |
          docker build \
            -t delivery-service \
            -f ./services/delivery_service/Dockerfile \
            .



      - name: Build Notification Service
        run: |
          docker build \
            -t notification-service \
            -f ./services/notification_service/Dockerfile \
            .



      - name: Build Support Service
        run: |
          docker build \
            -t support-service \
            -f ./services/support_service/Dockerfile \
            .

      - name: CI Success
        run: |
          echo "All checks + builds passed successfully "