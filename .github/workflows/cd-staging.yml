name: CD Staging Pipeline

on:
  push:
    branches:
      - develop

jobs:
  deploy-staging:
    runs-on: ubuntu-latest

    steps:

      # --------------------------------
      # CHECKOUT
      # --------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4


      # --------------------------------
      # SETUP PYTHON
      # --------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # --------------------------------
      # DOCKER BUILDX
      # --------------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3


      # --------------------------------
      # BUILD IMAGES
      # FIX: Use repo root (.) as build context and -f to point at the Dockerfile.
      # The Dockerfiles use paths like COPY services/api_gateway/... which are
      # relative to the repo root, not to the service subdirectory.
      # --------------------------------
      - name: Build API Gateway
        run: |
          docker build \
            -t api-gateway:staging \
            -f ./services/api_gateway/Dockerfile \
            .


      - name: Build Auth Service
        run: |
          docker build \
            -t auth-service:staging \
            -f ./services/auth_service/Dockerfile \
            .


      - name: Build User Service
        run: |
          docker build \
            -t user-service:staging \
            -f ./services/user_service/Dockerfile \
            .


      - name: Build Product Service
        run: |
          docker build \
            -t product-service:staging \
            -f ./services/product_service/Dockerfile \
            .


      - name: Build Inventory Service
        run: |
          docker build \
            -t inventory-service:staging \
            -f ./services/inventory_service/Dockerfile \
            .


      - name: Build Cart Service
        run: |
          docker build \
            -t cart-service:staging \
            -f ./services/cart_service/Dockerfile \
            .


      - name: Build Order Service
        run: |
          docker build \
            -t order-service:staging \
            -f ./services/order_service/Dockerfile \
            .


      - name: Build Payment Service
        run: |
          docker build \
            -t payment-service:staging \
            -f ./services/payment_service/Dockerfile \
            .


      - name: Build Delivery Service
        run: |
          docker build \
            -t delivery-service:staging \
            -f ./services/delivery_service/Dockerfile \
            .


      - name: Build Notification Service
        run: |
          docker build \
            -t notification-service:staging \
            -f ./services/notification_service/Dockerfile \
            .


      - name: Build Support Service
        run: |
          docker build \
            -t support-service:staging \
            -f ./services/support_service/Dockerfile \
            .


      # --------------------------------
      # STAGING SUCCESS
      # --------------------------------
      - name: Deployment Success
        run: |
          echo "Staging deployment pipeline completed 🚀"